backend = "wal"
color_space = "lab"
palette = "dark"

[templates]
kitty = { template = "kitty_template.conf", target = "~/.config/kitty/colours.conf" }
rofi = { template = "rofi_template.rasi", target = "~/.config/rofi/colours.rasi" }
quickshell = { template = "quickshell_template.qml", target = "~/.config/quickshell/Colours.qml" }
btop = { template = "btop_template.theme", target = "~/.config/btop/themes/wallust.theme" }
wlogout = { template = "wlogout_template.css", target = "~/.config/wlogout/colours.css" }
swaync = { template = "swaync_template.css", target = "~/.config/swaync/colours.css" }
niri = { template = "niri_template.kdl", target = "~/.config/niri/colours.kdl" }

vscodium = { template = 'vscodium/vscodium-2_template.json', target = '~/.cache/wallust/colors.json' }
vscodium2 = { template = 'vscodium/vscodium-1_template', target = '~/.cache/wallust/colors' }

swaylock_tint = { template = 'swaylock/swaylock-overlay_template.svg', target = '~/.config/swaylock/lock-overlay.svg' }
swaylock_script = { template = 'swaylock/screen-locker_template.sh', target = '~/scripts/screen_locker.sh' }

zen_content = { template = "zen/usercontent_template.css", target = "~/.config/zen/zazj0q2n.test/chrome/userContent.css" }
zen_chrome = { template = "zen/userchrome_template.css", target = "~/.config/zen/zazj0q2n.test/chrome/userChrome.css" }
zen_js = { template = "zen/user_template.js", target = "~/.config/zen/zazj0q2n.test/user.js" }
zen_darkreader = { template = "zen/darkreader_template.json", target = "~/.cache/wallust/darkreader_colors.json" }

gtk3 = { template = "gtk/gtk3_template.css", target = "~/.config/gtk-3.0/gtk.css" }
gtk4 = { template = "gtk/gtk4_template.css", target = "~/.config/gtk-4.0/gtk.css" }

qt5_colors = { template = "qt/qt_colours_template.conf", target = "~/.config/qt5ct/colors/wallust.conf" }
qt6_colors = { template = "qt/qt_colours_template.conf", target = "~/.config/qt6ct/colors/wallust.conf" }
qt5_qss = { template = "qt/qt_style_template.qss", target = "~/.config/qt5ct/qss/wallust.qss" }
qt6_qss = { template = "qt/qt_style_template.qss", target = "~/.config/qt6ct/qss/wallust.qss" }